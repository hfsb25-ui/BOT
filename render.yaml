# Render Blueprint - define os dois servicos do projeto (backend + frontend).
# Como usar: https://dashboard.render.com -> "New +" -> "Blueprint" -> conectar
# este repositorio no GitHub. O Render le este arquivo e cria tudo automaticamente.
# Guia completo: docs/DEPLOY.md

services:
  # --- Backend (API Express) -------------------------------------------------
  - type: web
    name: trading-analyzer-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Cole aqui, no painel do Render (aba Environment), a connection string
      # do seu banco Postgres gratuito (Neon/Supabase). Nao vai no Git.
      - key: DATABASE_URL
        sync: false
      # Cole sua chave da Twelve Data no painel do Render.
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: DEFAULT_MIN_SCORE
        value: "70"
      - key: DEFAULT_MIN_PROBABILITY
        value: "60"
      # URL PUBLICA (https://...onrender.com) do frontend, usada para liberar o CORS.
      # RENDER_EXTERNAL_URL e uma variavel que o proprio Render preenche
      # automaticamente com a URL publica real de cada servico.
      - key: FRONTEND_URL
        fromService:
          name: trading-analyzer-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- Frontend (site estatico React) -----------------------------------------
  - type: web
    runtime: static
    name: trading-analyzer-frontend
    rootDir: frontend
    # BACKEND_URL vem da URL publica real do backend (RENDER_EXTERNAL_URL),
    # nao do endereco interno - e por isso que o build usa ela para montar
    # VITE_API_URL, a variavel que o navegador do usuario vai usar de fato.
    buildCommand: "npm install && VITE_API_URL=\"${BACKEND_URL}/api\" npm run build"
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        fromService:
          name: trading-analyzer-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
