<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Analisador M5</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0D1218; color: #cbd5e1; width: 300px; padding: 14px; }
    h3 { margin: 0 0 2px 0; color: #f1f5f9; font-size: 14px; }
    p.sub { margin: 0 0 10px 0; font-size: 11px; color: #64748b; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; font-family: monospace; background: #131A22; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; font-weight: 700; }
    .badge.call { background: rgba(45,212,167,0.15); color: #2DD4A7; }
    .badge.put { background: rgba(251,107,91,0.15); color: #FB6B5B; }
    .badge.neutral { background: #1B2530; color: #64748b; }
    #empty { font-size: 12px; color: #64748b; }
    button { width: 100%; margin-top: 10px; padding: 8px; background: #1B2530; color: #cbd5e1; border: 1px solid #28333F; border-radius: 6px; cursor: pointer; font-size: 12px; }
    a { color: #2DD4A7; font-size: 11px; }
  </style>
</head>
<body>
  <h3>Analisador M5</h3>
  <p class="sub" id="lastPolled">Nunca verificado ainda</p>
  <div id="list"><p id="empty">Configure o backend primeiro.</p></div>
  <button id="pollNow">⟳ Verificar agora</button>
  <p><a href="#" id="openOptions">Configurar URL do backend</a></p>
  <script src="popup.js"></script>
</body>
</html>
